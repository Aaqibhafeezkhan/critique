<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 676" width="960" height="676" role="img" aria-labelledby="svg-title svg-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="svg-title">Critique product analytics — analytics snapshot</title>
  <desc id="svg-desc">Point-in-time event totals for Critique: 1,443 page views, 263 unique visitors, 232 project views, 315 discover views, 12 project submissions. Feedback funnel: 232 project views led to 92 feedback starts (39.7 percent), 65 feedback submit attempts (70.7 percent), and 20 successful feedback submissions (30.8 percent). Feedback submissions are 21.7 percent of feedback starts; project views are 16.1 percent of page views. Secondary metrics: 30 submit errors (46.2 percent of attempts); 123 sign-in prompts, 35 started, 20 succeeded; GitHub 46.2 percent and email 53.8 percent of 52 auth method selections; email verification succeeded for 7 of 16 sent (43.8 percent). Percentages are event ratios, not unique-user conversion rates. Reporting period not supplied; not live analytics.</desc>
